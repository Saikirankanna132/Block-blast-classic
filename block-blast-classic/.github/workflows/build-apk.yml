# Builds a release APK in the cloud (free) on every push + on demand.
# How to use:
#   1. Create a new GitHub repo and upload this whole project folder.
#   2. Open the repo's "Actions" tab -> "Build Android APK" -> download
#      the "BlockBlastClassic-apk" artifact (~5-10 min).
#   3. Or press "Run workflow" for an on-demand build.
name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install packages
        run: flutter pub get

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons || true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BlockBlastClassic-apk
          path: build/app/outputs/flutter-apk/app-release.apk
